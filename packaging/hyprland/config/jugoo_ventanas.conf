# Managed by Jugoo acomodador.py. Edit packaging/hyprland/jugoo_ventanas.conf.
# Windows-style windows: every window floats; title bar (hyprbars) drags,
# edges snap, and Ctrl+Alt shortcuts arrange without the Super key.

$jv = ~/.config/hypr/scripts/ventanas

exec-once = python3 ~/.config/hypr/scripts/ventanas.py daemon

windowrule {
    name = jugoo-flotantes-por-defecto
    match:class = .*
    float = true
}

# Firefox opens large; ventanas snaps it to the work area under the Jugoo bar
# (no compositor maximize — that can paint over a translucent exclusive zone).
windowrule {
    name = aidycos-firefox-float
    match:class = (firefox(-esr)?|org.mozilla.firefox)
    float = true
}

# Alt+Tab on the current desktop only (owned here — do not also bind cyclenext in hyprland.conf).
bind = ALT, Tab, exec, $jv alt-tab
bind = ALT SHIFT, Tab, exec, $jv alt-tab prev

# Snap: Ctrl+Alt + arrows (Up = maximize, Down = restore / minimize).
bind = CTRL ALT, Left, exec, $jv left
bind = CTRL ALT, Right, exec, $jv right
bind = CTRL ALT, Up, exec, $jv up
bind = CTRL ALT, Down, exec, $jv down
# Quarters: the U I / J K key block mirrors the screen corners.
bind = CTRL ALT, U, exec, $jv top-left
bind = CTRL ALT, I, exec, $jv top-right
bind = CTRL ALT, J, exec, $jv bottom-left
bind = CTRL ALT, K, exec, $jv bottom-right

# Arrange the current desktop.
bind = CTRL ALT, 2, exec, $jv split2
bind = CTRL ALT, 4, exec, $jv split4
bind = CTRL ALT, G, exec, $jv grid
bind = CTRL ALT, C, exec, $jv cascade

# Minimized windows (special:minimizados).
bind = CTRL ALT, M, exec, $jv minimize
bind = CTRL ALT, R, exec, $jv restore
bind = CTRL ALT SHIFT, R, exec, $jv restore-all
bind = CTRL ALT SHIFT, M, togglespecialworkspace, minimizados

bind = CTRL ALT, W, exec, $jv close

# Desktops: Ctrl+Alt+PgUp/PgDn switch; with Shift the window goes along.
bind = CTRL ALT, Next, workspace, +1
bind = CTRL ALT, Prior, workspace, -1
bind = CTRL ALT SHIFT, Next, movetoworkspace, +1
bind = CTRL ALT SHIFT, Prior, movetoworkspace, -1

# Super + arrows still snap (kept for muscle memory).
bind = SUPER ALT, Left, exec, $jv left
bind = SUPER ALT, Right, exec, $jv right
bind = SUPER ALT, Up, exec, $jv max
bind = SUPER SHIFT, SPACE, exec, $jv minimize
bind = SUPER SHIFT CONTROL, SPACE, exec, $jv restore-all
bind = SUPER ALT CONTROL, SPACE, togglespecialworkspace, minimizados

# Move / resize: Super still works; Alt is enough without Super.
# Windows with hyprbars can also be dragged from the title bar with no modifier.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

# Resize from window edges without modifiers.
general {
    resize_on_border = true
    extend_border_grab_area = 12
}
