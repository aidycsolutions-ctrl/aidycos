name = "aidyc-desktop"
description = "Perfil base de escritorio AidyCOS para Debian: Wayland, audio, SDDM, utilidades y Jugoo"
depends_on = ["desktop-runtime"]

[packages]
apt = [
  "adwaita-icon-theme",
  # Fullcolor legacy names (system-software-update, system-software-install,
  # etc.) live here; Adwaita 48 only Suggests this package.
  "adwaita-icon-theme-legacy",
  "dbus-user-session",
  "firmware-atheros",
  "firmware-brcm80211",
  "firmware-iwlwifi",
  "firmware-mediatek",
  "firmware-misc-nonfree",
  "firmware-realtek",
  "flatpak",
  "firefox-esr",
  "gir1.2-dbusmenu-gtk3-0.4",
  "gir1.2-gtk-3.0",
  "gir1.2-gtklayershell-0.1",
  "foot",
  "grim",
  "fonts-noto-color-emoji",
  "git",
  "hicolor-icon-theme",
  # Adwaita symbolic icons are SVG; without this GDK cannot render them and
  # Jugoo shows empty rectangles for Wi-Fi, battery, power, settings, etc.
  "librsvg2-common",
  "hyprland-protocols",
  "iw",
  "locales",
  "libnotify-bin",
  "network-manager",
  "pkexec",
  "polkitd",
  "python3-qrcode",
  "rfkill",
  "upower",
  "pipewire-audio",
  "python3",
  "python3-cairo",
  "python3-gi",
  "python3-gi-cairo",
  "qml6-module-qtquick",
  "qml6-module-qtquick-controls",
  "qml6-module-qtquick-layouts",
  "qml6-module-qtquick-virtualkeyboard",
  "sddm",
  "slurp",
  "synaptic",
  "thunar",
  # USB remount stack: apt installs with --no-install-recommends, so Thunar's
  # Recommends (udisks2/gvfs/thunar-volman) never land on a clean AidyCOS box.
  # gvfs-fuse is also a Recommends and is required for mounts under /run/user.
  "udisks2",
  "gvfs",
  "gvfs-backends",
  "gvfs-fuse",
  "thunar-volman",
  "ntfs-3g",
  "exfatprogs",
  "dosfstools",
  "usbutils",
  "wireless-regdb",
  "wpasupplicant",
  "zenity",
  "wireplumber",
  "xwayland",
  "cups",
  "cups-browsed",
  "cups-client",
  "system-config-printer",
]
