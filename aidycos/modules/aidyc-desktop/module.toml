name = "aidyc-desktop"
description = "Perfil base de escritorio AidyCOS para Debian: Wayland, audio, SDDM, utilidades y Jugoo"
depends_on = ["desktop-runtime"]

[packages]
apt = [
  "dbus-user-session",
  "gir1.2-dbusmenu-gtk3-0.4",
  "gir1.2-gtk-3.0",
  "gir1.2-gtklayershell-0.1",
  "foot",
  "grim",
  "fonts-noto-color-emoji",
  "git",
  "hyprland-protocols",
  "locales",
  "libnotify-bin",
  "network-manager",
  "upower",
  "pipewire-audio",
  "polkit-kde-agent-1",
  "python3",
  "python3-cairo",
  "python3-gi",
  "qml6-module-qtquick",
  "qml6-module-qtquick-controls",
  "qml6-module-qtquick-layouts",
  "qml6-module-qtquick-virtualkeyboard",
  "sddm",
  "slurp",
  "thunar",
  "zenity",
  "wireplumber",
  "xwayland",
  "cups",
  "cups-browsed",
]
