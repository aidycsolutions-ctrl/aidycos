[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidycos"
version = "0.1.0"
description = "Capa modular para preparar distribuciones Linux existentes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AidyCOS contributors" }]

[project.scripts]
aidycos = "aidycos.cli:main"

[tool.setuptools]
packages = ["aidycos", "aidycos.adapters"]

[tool.setuptools.package-data]
aidycos = ["modules/**/*.toml"]
